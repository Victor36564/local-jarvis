audio:
  sample_rate: 16000
  channels: 1
  wake_chunk_size: 1280
  command_seconds: 20
  silence_seconds: 2.0
  silence_threshold: 0.01
  wake_threshold: 0.5
  debounce_seconds: 1.0
  device_index: null
  transcription_mode: stt_fallback
  stt_model_id: openai/whisper-small.en

vision:
  max_width: 1280
  max_height: 720
  primary_monitor_only: true

model:
  model_id: google/gemma-4-E4B-it
  device: cuda:0
  quantization: 4bit
  max_new_tokens: 256
  max_context_tokens: 4096
  vram_budget_gb: 7.5

tools:
  command_timeout_seconds: 25
  max_output_chars: 12000
  allowlist:
    - dir
    - echo
    - type
    - where
    - whoami
    - hostname
    - ver
    - systeminfo
    - tasklist
    - ipconfig
    - getmac
    - arp
    - nslookup
    - ping
    - tracert
    - pathping
    - netstat
    - driverquery
    - powercfg /getactivescheme
    - wmic cpu get loadpercentage
    - wmic os get freephysicalmemory,totalvisiblememorysize
    - nvidia-smi
    - Get-Process
    - Get-Service
    - Get-Counter
    - Get-ComputerInfo
    - Get-CimInstance
    - Get-NetIPConfiguration
    - Get-Disk
    - Get-Volume
    - Get-WinEvent
    - Get-ChildItem
    - Get-Location
    - explorer
    - 'start '
    - 'start ms-settings:'
    - 'start shell:'
    - 'start https://'
    - 'start http://'
    - 'start ""'
    - control
    - winget search
    - 'powershell -NoProfile -Command "Set-ItemProperty -Path ''HKCU:\Control Panel\Desktop'' -Name Wallpaper -Value'
    - RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters
    - git status
    - git log
    - python --version

runtime:
  listen_on_startup: true
  recursion_limit: 4
  max_tool_calls_per_turn: 3
  log_level: INFO
